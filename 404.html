<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page Not Found — Velmora Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1b1b;
    --paper:#faf7f2;
    --gold:#b8925a;
    --gold-deep:#8f6d3f;
    --muted:#726b60;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    text-align:center;
    padding:20px;
  }
  .wrap{max-width:420px;}
  .code{
    font-family:'Playfair Display',serif;
    font-size:96px;
    font-weight:700;
    color:var(--gold);
    line-height:1;
    margin:0;
  }
  h1{
    font-family:'Playfair Display',serif;
    font-size:26px;
    margin:12px 0 8px;
  }
  p{
    color:var(--muted);
    font-size:15px;
    margin:0 0 28px;
  }
  a.btn{
    display:inline-block;
    background:var(--ink);
    color:var(--paper);
    text-decoration:none;
    padding:14px 32px;
    border-radius:26px;
    font-weight:600;
    font-size:14px;
    transition:background .2s;
  }
  a.btn:hover{ background:var(--gold); color:var(--ink); }
</style>
</head>
<body>
  <div class="wrap">
    <p class="code">404</p>
    <h1 id="err404Title">This page wandered off</h1>
    <p id="err404Text">The page you're looking for doesn't exist or may have moved. Let's get you back to shopping.</p>
    <a class="btn" id="err404Btn" href="/">← Back to Velmora Shop</a>
  </div>
  <script>
    const ERR_TEXT = {
      en: { title: "This page wandered off", text: "The page you're looking for doesn't exist or may have moved. Let's get you back to shopping.", btn: "← Back to Velmora Shop" },
      ar: { title: "هذه الصفحة غير موجودة", text: "الصفحة التي تبحث عنها غير موجودة أو ربما تم نقلها. دعنا نعيدك إلى التسوق.", btn: "→ العودة إلى Velmora Shop" },
      ur: { title: "یہ صفحہ نہیں ملا", text: "جو صفحہ آپ تلاش کر رہے ہیں وہ موجود نہیں ہے یا شاید منتقل ہو گیا ہے۔ آئیے آپ کو خریداری کی طرف واپس لے چلتے ہیں۔", btn: "→ Velmora Shop پر واپس جائیں" },
      hi: { title: "यह पेज नहीं मिला", text: "आप जिस पेज को खोज रहे हैं वह मौजूद नहीं है या स्थानांतरित हो गया है। चलिए आपको वापस शॉपिंग पर ले चलते हैं।", btn: "← Velmora Shop पर वापस जाएं" }
    };
    try{
      const lang = localStorage.getItem("velmora_lang") || "en";
      const dict = ERR_TEXT[lang] || ERR_TEXT.en;
      document.getElementById("err404Title").textContent = dict.title;
      document.getElementById("err404Text").textContent = dict.text;
      document.getElementById("err404Btn").textContent = dict.btn;
      if(lang === "ar"){
        document.documentElement.setAttribute("dir", "rtl");
        document.documentElement.setAttribute("lang", "ar");
      }
    }catch(e){}
  </script>
</body>
</html>
